name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos-app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Native model, runtime and copy tests
        run: swift test
      - name: Universal release candidate and localization resources
        run: |
          zsh release.zsh development 0.1.0 1
          cd build/releases/development-0.1.0-1
          shasum -a 256 -c SHA256SUMS
          plutil -lint Sync-Kopien.app/Contents/Resources/PrivacyInfo.xcprivacy
      - name: Packaged app without development resources
        run: |
          mv .build .build-resources-hidden
          app_pid=''
          trap 'if [ -n "$app_pid" ]; then kill "$app_pid" 2>/dev/null || true; fi; mv .build-resources-hidden .build' EXIT
          build/releases/development-0.1.0-1/Sync-Kopien.app/Contents/MacOS/SyncCopies --demo &
          app_pid=$!
          sleep 3
          kill -0 "$app_pid"

  tests:
    runs-on: macos-15
    strategy:
      matrix:
        # The oldest supported version and the newest, which Homebrew installs.
        python-version: ['3.10', '3.x']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Shell syntax
        run: |
          # zsh -n treats every file after the first as a script argument.
          for script in *.zsh; do /bin/zsh -n "$script"; done
          for script in macos-app/*.zsh; do /bin/zsh -n "$script"; done
          /bin/bash -n setup-google-drive.sh
      - name: Isolated sync and API tests
        run: python3 -m unittest discover -s tests -v
